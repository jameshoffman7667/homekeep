services:
  homekeep:
    # Pulled from Docker Hub — built and published automatically by
    # .github/workflows/docker-publish.yml. Replace "mybadreligon"
    # below with your own Docker Hub username if you're publishing
    # under a different account.
    #
    # This is a pure image deploy — there's no `build:` section here,
    # so `docker compose up` (or a Portainer stack from this file
    # alone) never needs the Dockerfile or source tree, just Docker
    # Hub access. To build the image yourself instead of waiting on
    # CI, see "Prebuilding the image" in README.md.
    image: mybadreligon/homekeep:latest
    container_name: homekeep
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8040}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your .env file (or in Portainer's stack environment variables) — see .env.example}
      # Leave COOKIE_SECURE unset/false for plain-HTTP local access.
      # Set to "true" once this sits behind HTTPS (e.g. a reverse
      # proxy you run separately) — browsers drop secure cookies sent
      # over plain HTTP.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Optional email digest (overdue work orders, expiring warranties,
      # unreviewed work requests) — leave SMTP_HOST blank to disable.
      # See .env.example for details.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - NOTIFY_WARRANTY_WINDOW_DAYS=${NOTIFY_WARRANTY_WINDOW_DAYS:-30}
      - NOTIFY_UNREVIEWED_WINDOW_DAYS=${NOTIFY_UNREVIEWED_WINDOW_DAYS:-3}
      # Componentized features (v2) — see .env.example and
      # backend/features.js. Set FEATURE_HA_ALARMS=false in a fork's own
      # .env (or Portainer stack env) to ship that edition without the
      # Home Assistant alarm integration.
      # Blank = follow the edition's default (on for "home", off for "facilities").
      - FEATURE_HA_ALARMS=${FEATURE_HA_ALARMS:-}
      # Edition / branding / terminology (v2.1) — see .env.example and
      # backend/branding.config.js. All optional; blank = edition default.
      - EDITION=${EDITION:-home}
      - BRAND_NAME=${BRAND_NAME:-}
      - BRAND_SHORT_NAME=${BRAND_SHORT_NAME:-}
      - BRAND_TAGLINE=${BRAND_TAGLINE:-}
      - BRAND_LOGO_URL=${BRAND_LOGO_URL:-}
      - BRAND_COLOR_PRIMARY=${BRAND_COLOR_PRIMARY:-}
      - BRAND_COLOR_PRIMARY_DARK=${BRAND_COLOR_PRIMARY_DARK:-}
      - BRAND_COLOR_ACCENT=${BRAND_COLOR_ACCENT:-}
      - BRAND_COLOR_ACCENT_DARK=${BRAND_COLOR_ACCENT_DARK:-}
      - ORG_NOUN=${ORG_NOUN:-}
      - LOCATION_LEVEL_LABELS=${LOCATION_LEVEL_LABELS:-}
      - SITE_LEVEL_INDEX=${SITE_LEVEL_INDEX:-}
      - SEED_CATALOG_FILE=${SEED_CATALOG_FILE:-}
    volumes:
      - homekeep_data:/data
    ports:
      # Set PORT in your .env (or Portainer's stack environment variables)
      # to change this — both the host and container side move together.
      # Local web portal access: http://<this-machine's-LAN-IP>:${PORT:-8040}
      - "${PORT:-8040}:${PORT:-8040}"

volumes:
  homekeep_data:
