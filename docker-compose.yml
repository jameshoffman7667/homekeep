services:
  homekeep:
    # Pulled from GitHub Container Registry by default — built and
    # published automatically by .github/workflows/docker-publish.yml.
    # Replace OWNER/REPO with your actual GitHub owner/repo (lowercase).
    # `build:` is kept as a local fallback: if the image above hasn't
    # been pulled yet, `docker compose up --build` will build it from
    # the Dockerfile in this repo instead.
    image: ghcr.io/OWNER/REPO:latest
    build: .
    container_name: homekeep
    restart: unless-stopped
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your .env file (or in Portainer's stack environment variables) — see .env.example}
      # Leave COOKIE_SECURE unset/false for plain-HTTP local access.
      # Set to "true" once served over HTTPS (e.g. via the caddy profile
      # below) — browsers drop secure cookies sent over plain HTTP.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      - homekeep_data:/data
    ports:
      # Local web portal access: http://<this-machine's-LAN-IP>:8080
      - "8080:8080"

  # Optional: automatic-HTTPS reverse proxy for remote access (needed for
  # a fully installable Android PWA outside your own LAN). Only starts
  # with `docker compose --profile https up`. Requires a domain name
  # pointed at this host and ports 80/443 reachable from the internet.
  caddy:
    image: caddy:2-alpine
    container_name: homekeep-caddy
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      - homekeep
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  homekeep_data:
  caddy_data:
  caddy_config:
