name: Build and publish Docker image

# Builds the Dockerfile in this repo and pushes it to Docker Hub on
# every push to main and on version tags. Anything that just needs to
# *run* the app — docker-compose.yml here, or a Portainer stack built
# from that file alone — can then pull the image instead of needing
# the Dockerfile or source tree at all.
#
# Requires two repository secrets (Settings -> Secrets and variables
# -> Actions -> "New repository secret"):
#   DOCKERHUB_USERNAME  — your Docker Hub username
#   DOCKERHUB_TOKEN     — a Docker Hub access token (Docker Hub ->
#                         Account Settings -> Security -> New Access
#                         Token; needs Read & Write scope). Don't use
#                         your account password here.

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/maintenhance
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
